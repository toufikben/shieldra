name: Group A diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostics:
    name: Reproducible Android/Gradle environment diagnostics
    runs-on: ubuntu-24.04
    # Only the device-APK publish step needs this, and it is the single job that runs it:
    # Q-K-5's required-APK rule is now enforced on a rolling draft release, because Actions
    # artifact storage is exhausted. No step reads or writes source files with this token.
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Run Group A diagnostics
        shell: bash
        run: bash .github/scripts/group-a-diagnostics.sh

      - name: Run Group B and Group C tests and Android build
        shell: bash
        run: ./gradlew clean test lint assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Run Group C boundary scan
        shell: bash
        run: bash .github/scripts/group-c-contract-check.sh

      - name: Run G4-B local storage review
        shell: bash
        run: bash .github/scripts/g4b-review-check.sh

      - name: Run Phase 3 static review
        shell: bash
        run: bash .github/scripts/phase3-review-check.sh

      - name: Publish test result counts to job summary
        if: always()
        shell: bash
        run: bash .github/scripts/test-summary.sh

      - name: Publish actual evidence to job summary
        if: always()
        shell: bash
        run: cat evidence/group-a-diagnostics.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the device APK pair to the rolling draft release
        if: success()
        shell: bash
        run: bash .github/scripts/publish-device-apks.sh

      # The artifact copy stays, but it is no longer the authority: it cannot upload while GitHub's
      # artifact storage is exhausted (Q-K-5), and the step above already fails the run when the
      # pair is missing, so a tolerated failure here cannot hide an absent APK.
      - name: Upload built APKs for owner-device execution
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ github.run_id }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload JVM test result reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ github.run_id }}
          path: app/build/test-results/**/*.xml
          if-no-files-found: warn

      - name: Upload actual diagnostic evidence when storage is available
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: group-a-evidence-${{ github.run_id }}
          path: evidence/group-a-diagnostics.md
          if-no-files-found: warn

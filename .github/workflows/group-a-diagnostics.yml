name: Group A diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostics:
    name: Reproducible Android/Gradle environment diagnostics
    runs-on: ubuntu-24.04
    # Only the device-APK publish step needs this, and it is the single job that runs it:
    # Q-K-5's required-APK rule is now enforced on a rolling draft release, because Actions
    # artifact storage is exhausted. No step reads or writes source files with this token.
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Run Group A diagnostics
        shell: bash
        run: bash .github/scripts/group-a-diagnostics.sh

      - name: Run Group B and Group C tests and Android build
        shell: bash
        run: ./gradlew clean test lint assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Run Group C boundary scan
        shell: bash
        run: bash .github/scripts/group-c-contract-check.sh

      - name: Run G4-B local storage review
        shell: bash
        run: bash .github/scripts/g4b-review-check.sh

      - name: Run Phase 3 static review
        shell: bash
        run: bash .github/scripts/phase3-review-check.sh

      - name: Publish test result counts to job summary
        if: always()
        shell: bash
        run: bash .github/scripts/test-summary.sh

      - name: Publish actual evidence to job summary
        if: always()
        shell: bash
        run: cat evidence/group-a-diagnostics.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the device APK pair to the rolling draft release
        if: success()
        shell: bash
        env:
          # The GitHub CLI does not read the job token implicitly inside a run step.
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-device-apks.sh

      - name: Build the signed release APK and AAB
        if: success()
        shell: bash
        env:
          # app/build.gradle.kts reads key.properties from the repository root and falls
          # back to the debug key when it is absent, so this step is the whole difference
          # between an uploadable release build and a debug-signed one.
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Repository secret KEYSTORE_BASE64 is not set - add it before this step can sign a build." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
          printf 'storeFile=release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > key.properties
          ./gradlew assembleRelease bundleRelease --stacktrace
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publish the signed pair to the rolling release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create release-latest \
            --prerelease \
            --title "Release builds" \
            --notes "Rolling signed release - every green CI run replaces these files." \
            || true
          gh release upload release-latest \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            --clobber

      # The artifact copy stays, but it is no longer the authority: it cannot upload while GitHub's
      # artifact storage is exhausted (Q-K-5), and the step above already fails the run when the
      # pair is missing, so a tolerated failure here cannot hide an absent APK.
      - name: Upload built APKs for owner-device execution
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ github.run_id }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload JVM test result reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ github.run_id }}
          path: app/build/test-results/**/*.xml
          if-no-files-found: warn

      - name: Upload actual diagnostic evidence when storage is available
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: group-a-evidence-${{ github.run_id }}
          path: evidence/group-a-diagnostics.md
          if-no-files-found: warn
